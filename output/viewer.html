<!doctype html><html lang="en"><meta charset="utf-8"><title>BBPlus local question viewer</title><style>body{font:16px system-ui;max-width:900px;margin:2rem auto;padding:0 1rem;line-height:1.5}article{border:1px solid #bbb;border-radius:8px;margin:1rem 0;padding:1rem}img{max-width:100%}label{margin-right:1rem}input,select{font:inherit;padding:.4rem}</style><h1>BBPlus local question viewer</h1><p>Run <code>python3 -m http.server 8000</code> from this output directory, then open <code>http://localhost:8000/viewer.html</code>.</p><label>Search <input id="q"></label><label>Subject <select id="subject"><option value="">All</option><option>Math</option><option>Reading and Writing</option></select></label><label>Module <select id="module"><option value="">All</option></select></label><label><input type="checkbox" id="missing"> Missing answers only</label><p id="count"></p><main id="list"></main><script>
let all=[];fetch('questions.json').then(r=>{if(!r.ok)throw new Error('Question data is not installed');return r.json()}).then(x=>{all=x;for(const m of [...new Set(x.map(q=>q.test_name))].sort()){let o=document.createElement('option');o.textContent=m;module.append(o)}render()}).catch(err=>{
count.textContent='No question database installed.';
list.textContent='Import your own authorized questions.json file into the output folder, then refresh this page.';
console.error(err);
});function render(){let a=all.filter(x=>(!q.value||x.question_text.toLowerCase().includes(q.value.toLowerCase()))&&(!subject.value||x.subject===subject.value)&&(!module.value||x.test_name===module.value)&&(!missing.checked||!x.answer_verified));count.textContent=`${a.length} of ${all.length} records`;list.replaceChildren();for(let x of a.slice(0,100)){let art=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),ol=document.createElement('ol'),meta=document.createElement('p');h.textContent=`${x.test_name} · ${x.subject} · Q${x.question_number}`;p.textContent=x.question_text;for(let c of x.answer_choices){let li=document.createElement('li');li.textContent=c.text;ol.append(li)}meta.textContent=`Answer: ${x.answer_verified?JSON.stringify(x.correct_answer):'missing'} · Images: ${x.image_references.length}`;art.append(h,p,ol,meta);for(let path of x.local_asset_paths){let img=document.createElement('img');img.src='assets/'+path.split('/').pop();img.alt='Question asset';art.append(img)}list.append(art)}}for(let el of [q,subject,module,missing])el.addEventListener('input',render)
</script></html>
